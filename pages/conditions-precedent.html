<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conditions Precedent — PropertyPro Zambia</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/pages/conditions-precedent.css">
  <link rel="stylesheet" href="../css/pages/dashboard.css">
</head>

<body>
  <div class="app">
    <div id="app-sidebar"></div>
    <div class="main">
      <div id="app-topbar"></div>
      <div id="app-breadcrumb"></div>
      <main class="content">
        <div class="pr-page">
          <div class="pr-header">
            <div>
              <h1>Conditions Precedent</h1>
              <p>Institutional Conditions Precedent — integrated Property + Investment system</p>
            </div>
            <div class="pr-header-actions"><button class="pr-btn" id="conditions-precedentExport">Export</button><button
                class="pr-btn pr-btn-primary" id="conditions-precedentAdd">Add New</button></div>
          </div>
          <div class="pr-kpi-grid" id="conditions-precedentKpiGrid"></div>
          <div class="pr-filters-card">
            <div class="pr-search"><input id="conditions-precedentSearch"
                placeholder="Search Conditions Precedent..." /><span
                style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#94A3B8">🔍</span></div>
            <div class="pr-filters-group"><select class="pr-select" id="conditions-precedentFundFilter">
                <option value="All">All Funds</option>
              </select><select class="pr-select" id="conditions-precedentStatusFilter">
                <option value="All">All Status</option>
              </select></div><button class="pr-btn pr-btn-ghost" id="conditions-precedentClear">Clear</button>
          </div>
          <div class="pr-table-card">
            <div class="pr-table-wrap">
              <table class="pr-table" id="conditions-precedentTable">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Type</th>
                    <th>Value</th>
                    <th>Status</th>
                    <th>Owner/Date</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
            <div class="table-footer"><span id="conditions-precedentCount"></span>
              <div style="display:flex;gap:8px"><button class="btn" id="conditions-precedentPrev">Prev</button><button
                  class="btn" id="conditions-precedentNext">Next</button></div>
            </div>
          </div>
        </div>
        <div class="pr-drawer" id="conditions-precedentDrawer">
          <div class="pr-drawer-backdrop" id="conditions-precedentBackdrop"></div>
          <div class="pr-drawer-panel">
            <div class="pr-drawer-head">
              <div>
                <h2 id="conditions-precedentDrawerTitle">Conditions Precedent</h2>
                <div class="small muted" id="conditions-precedentDrawerMeta"></div>
              </div><button class="btn" id="conditions-precedentClose">✕</button>
            </div>
            <div class="pr-drawer-body" id="conditions-precedentBody"></div>
            <div class="pr-drawer-foot"><button class="pr-btn"
                onclick="document.getElementById('conditions-precedentDrawer').classList.remove('open')">Close</button><button
                class="pr-btn pr-btn-primary">Open Record</button></div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <div id="toastContainer" class="toast-container"></div>
  <div id="globalSearchBackdrop" class="modal-backdrop">
    <div class="modal">
      <div class="modal-head">
        <div style="display:flex;align-items:center;gap:10px;flex:1"><svg width="18" height="18" viewBox="0 0 24 24"
            fill="none" stroke="#64748B" stroke-width="1.8">
            <circle cx="11" cy="11" r="6" />
            <path d="M20 20l-3.5-3.5" />
          </svg><input id="globalSearchInput" placeholder="Search..." style="flex:1;border:0;outline:0;font-size:14px"
            autofocus /></div><button class="btn btn-ghost"
          onclick="document.getElementById('globalSearchBackdrop').classList.remove('open')">Esc</button>
      </div>
      <div class="modal-body">
        <div id="globalSearchResults"></div>
      </div>
    </div>
  </div>
  <script src="../js/common.js"></script>
  <script src="../js/investment-calculations.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/pages/conditions-precedent.js"></script>
  <script>Layout.init({ currentPage: 'conditions-precedent' });</script>
</body>

</html>
